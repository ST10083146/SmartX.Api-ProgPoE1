# Starts the whole system with one command:  docker compose up --build
#   API       -> http://localhost:5080
#   Dashboard -> http://localhost:5173
services:
  api:
    build: ./SmartX.Api
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # The device simulator calls the API over HTTP. Inside the container the API listens on 8080.
      - Simulator__BaseUrl=http://localhost:8080

  client:
    build: ./smartx-client
    ports:
      - "5173:80"
    depends_on:
      - api
